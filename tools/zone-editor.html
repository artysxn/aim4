<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zone Editor · AIM4</title>
<style>
  @font-face {
    font-family: 'Host Grotesk';
    src: url('/fonts/host_grotesk/HostGrotesk-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Host Grotesk';
    src: url('/fonts/host_grotesk/HostGrotesk-SemiBold.ttf') format('truetype');
    font-weight: 600; font-style: normal; font-display: swap;
  }
  :root {
    --bg: #0a0a0a;
    --panel: rgba(14, 17, 21, 0.97);
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text: #f2f2f2;
    --muted: #9c9ca2;
    --accent: #f52525;
    --radius: 10px;
    --radius-sm: 8px;
    --radius-xs: 5px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Host Grotesk', system-ui, sans-serif;
    overflow: hidden;
  }
  .ze {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100%;
  }
  .ze-top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(12, 14, 18, 0.96);
  }
  .ze-brand {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .ze-brand span { color: var(--accent); }
  .ze-maps {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .ze-map-tab {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .ze-map-tab:hover { color: var(--text); border-color: var(--border-strong); }
  .ze-map-tab.active {
    color: var(--text);
    border-color: rgba(245, 37, 37, 0.55);
    background: rgba(245, 37, 37, 0.12);
  }
  .ze-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    min-height: 0;
  }
  .ze-stage {
    position: relative;
    min-width: 0;
    min-height: 0;
    background: #0b0d10;
  }
  #ze-canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
  }
  .ze-float {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: rgba(14, 17, 21, 0.92);
    z-index: 2;
  }
  .ze-float button, .ze-icon-btn {
    width: 30px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: transparent;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
  }
  .ze-float button:hover, .ze-icon-btn:hover {
    color: var(--text);
    background: rgba(255,255,255,0.06);
  }
  #ze-zoom {
    min-width: 48px;
    text-align: center;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .ze-side {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-left: 1px solid var(--border);
    background: var(--panel);
  }
  .ze-side-head {
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--border);
  }
  .ze-side-head h2 {
    margin: 0 0 10px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ze-field label {
    display: block;
    margin-bottom: 4px;
    font-size: 11px;
    color: var(--muted);
  }
  .ze-field input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: rgba(0,0,0,0.35);
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }
  .ze-hint {
    margin: 8px 0 0;
    font-size: 11px;
    line-height: 1.4;
    color: var(--muted);
  }
  #ze-list {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 8px;
  }
  .ze-empty {
    margin: 16px 8px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
  }
  .ze-row {
    display: grid;
    grid-template-columns: 14px 1fr auto auto;
    gap: 6px;
    align-items: center;
    padding: 6px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    border-radius: var(--radius-xs);
  }
  .ze-row.selected {
    border-color: var(--border-strong);
    background: rgba(255,255,255,0.04);
  }
  .ze-row.is-hidden { opacity: 0.45; }
  .ze-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .ze-row-name {
    width: 100%;
    min-width: 0;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: rgba(0,0,0,0.3);
    color: var(--text);
    font: inherit;
    font-size: 12px;
  }
  .ze-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: rgba(12, 14, 18, 0.96);
  }
  #ze-status {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: var(--muted);
  }
  #ze-status[data-kind='ok'] { color: #7bc96f; }
  #ze-status[data-kind='err'] { color: #e2622a; }
  .btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:hover { background: rgba(255,255,255,0.06); }
  .btn.primary {
    border-color: rgba(245, 37, 37, 0.55);
    background: rgba(245, 37, 37, 0.16);
  }
  .btn.primary.is-dirty {
    background: rgba(245, 37, 37, 0.35);
  }
  .ze-modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    padding: 20px;
  }
  .ze-modal[hidden] { display: none; }
  .ze-modal-card {
    width: min(420px, 100%);
    padding: 18px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: #12151a;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
  }
  .ze-modal-card p { margin: 0 0 10px; font-size: 14px; line-height: 1.45; }
  .ze-modal-hint { color: var(--muted); font-size: 12px !important; }
  .ze-modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }
  a.ze-back {
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    white-space: nowrap;
  }
  a.ze-back:hover { color: var(--text); }
</style>
</head>
<body>
  <div class="ze">
    <header class="ze-top">
      <a class="ze-back" href="/tools">← Tools</a>
      <div class="ze-brand">Zone <span>Editor</span></div>
      <div class="ze-maps" id="ze-maps"></div>
    </header>
    <div class="ze-body">
      <div class="ze-stage">
        <div class="ze-float">
          <button type="button" id="ze-zoom-out" title="Zoom out">−</button>
          <span id="ze-zoom">100%</span>
          <button type="button" id="ze-zoom-in" title="Zoom in">+</button>
          <button type="button" id="ze-reset" title="Reset view">⟲</button>
        </div>
        <canvas id="ze-canvas"></canvas>
      </div>
      <aside class="ze-side">
        <div class="ze-side-head">
          <h2>Areas</h2>
          <div class="ze-field">
            <label for="ze-name">Label for next square</label>
            <input id="ze-name" type="text" maxlength="48" value="Banana" placeholder="Zone name" />
          </div>
          <p class="ze-hint">Same name merges into one zone. Overlaps ask which side keeps the area. Drag to draw · Shift-drag to pan · Scroll to zoom.</p>
        </div>
        <div id="ze-list"></div>
      </aside>
    </div>
    <footer class="ze-foot">
      <span id="ze-status"></span>
      <button type="button" class="btn" id="ze-discard">Discard</button>
      <button type="button" class="btn primary" id="ze-save">Review &amp; Save</button>
    </footer>
  </div>
  <div class="ze-modal" id="ze-overlap" hidden>
    <div class="ze-modal-card" id="ze-overlap-body"></div>
  </div>
  <script type="module" src="/src/tools/zoneEditorMain.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Position Editor · AIM4</title>
<style>
  @font-face {
    font-family: 'Host Grotesk';
    src: url('/fonts/host_grotesk/HostGrotesk-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Host Grotesk';
    src: url('/fonts/host_grotesk/HostGrotesk-SemiBold.ttf') format('truetype');
    font-weight: 600; font-style: normal; font-display: swap;
  }
  :root {
    --bg: #0a0a0a;
    --panel: rgba(14, 17, 21, 0.97);
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.18);
    --text: #f2f2f2;
    --muted: #9c9ca2;
    --accent: #f52525;
    --radius: 10px;
    --radius-sm: 8px;
    --radius-xs: 5px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Host Grotesk', system-ui, sans-serif;
    overflow: hidden;
  }
  .ze {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100%;
  }
  .ze-top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(12, 14, 18, 0.96);
  }
  .ze-brand {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .ze-brand span { color: var(--accent); }
  .ze-maps {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .ze-map-tab {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .ze-map-tab:hover { color: var(--text); border-color: var(--border-strong); }
  .ze-map-tab.active {
    color: var(--text);
    border-color: rgba(245, 37, 37, 0.55);
    background: rgba(245, 37, 37, 0.12);
  }
  .ze-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    min-height: 0;
  }
  .ze-stage {
    position: relative;
    min-width: 0;
    min-height: 0;
    background: #0b0d10;
  }
  #ze-canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
  }
  #ze-canvas.ze-drop-target {
    outline: 2px dashed rgba(245, 37, 37, 0.55);
    outline-offset: -6px;
  }
  .ze-float {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: rgba(14, 17, 21, 0.92);
    z-index: 2;
  }
  .ze-float button, .ze-icon-btn {
    width: 30px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: transparent;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
  }
  .ze-float button:hover, .ze-icon-btn:hover {
    color: var(--text);
    background: rgba(255,255,255,0.06);
  }
  #ze-zoom {
    min-width: 48px;
    text-align: center;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .ze-side {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
    border-left: 1px solid var(--border);
    background: var(--panel);
  }
  .ze-side-head {
    flex: 0 0 auto;
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--panel);
  }
  .ze-color-mode {
    display: flex;
    gap: 4px;
  }
  .ze-color-mode button {
    flex: 1;
    padding: 6px 4px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .ze-color-mode button:hover {
    color: var(--text);
    border-color: var(--border-strong);
  }
  .ze-color-mode button.active {
    color: var(--text);
    border-color: rgba(245, 37, 37, 0.55);
    background: rgba(245, 37, 37, 0.12);
  }
  .ze-panel {
    flex: 0 0 auto;
    border-bottom: 1px solid var(--border);
  }
  .ze-panel:last-child { border-bottom: none; }
  .ze-panel > summary {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
    user-select: none;
  }
  .ze-panel > summary::-webkit-details-marker { display: none; }
  .ze-panel > summary::before {
    content: '▸';
    display: inline-block;
    width: 14px;
    margin-right: 4px;
    font-size: 10px;
    transition: transform 0.15s ease;
  }
  .ze-panel[open] > summary::before { transform: rotate(90deg); }
  .ze-panel > summary:hover { color: var(--text); }
  .ze-panel-body {
    padding: 0 14px 12px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .ze-panel[open] .ze-panel-list {
    max-height: min(240px, 32vh);
    overflow-y: auto;
    margin-top: 8px;
    padding: 4px 0;
  }
  .ze-swatch-wrap {
    position: relative;
    width: 14px;
    height: 14px;
    flex: 0 0 auto;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.25);
    cursor: pointer;
  }
  .ze-swatch-wrap input[type='color'] {
    position: absolute;
    inset: -4px;
    width: calc(100% + 8px);
    height: calc(100% + 8px);
    padding: 0;
    border: none;
    cursor: pointer;
    background: none;
  }
  .ze-swatch-wrap:has(input:disabled) {
    opacity: 0.75;
    cursor: default;
  }
  .ze-field input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: rgba(0,0,0,0.35);
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }
  .ze-field-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    align-items: stretch;
  }
  .ze-field-row .ze-icon-btn {
    width: 36px;
    height: auto;
    min-height: 34px;
  }
  .ze-empty {
    margin: 8px 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
  }
  .ze-row {
    display: grid;
    grid-template-columns: 14px 1fr auto auto;
    gap: 6px;
    align-items: center;
    padding: 6px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    border-radius: var(--radius-xs);
  }
  .ze-row.selected {
    border-color: rgba(245, 37, 37, 0.45);
    background: rgba(245, 37, 37, 0.1);
  }
  .ze-row.is-hidden { opacity: 0.45; }
  .ze-row[draggable='true'] { cursor: grab; }
  .ze-row.ze-dragging { opacity: 0.45; }
  .ze-list-drop.ze-drop-over {
    outline: 1px dashed rgba(245, 37, 37, 0.45);
    outline-offset: -2px;
    border-radius: var(--radius-xs);
  }
  .ze-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.2);
    flex: 0 0 auto;
  }
  .ze-sec-top {
    display: grid;
    grid-template-columns: 14px 1fr auto;
    gap: 6px;
    align-items: center;
  }
  .ze-row-name {
    width: 100%;
    min-width: 0;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: rgba(0,0,0,0.3);
    color: var(--text);
    font: inherit;
    font-size: 12px;
  }
  .ze-sec {
    margin-bottom: 6px;
    border: 1px solid transparent;
    border-radius: var(--radius-xs);
    padding: 6px;
    min-height: 44px;
  }
  .ze-sec.selected {
    border-color: rgba(245, 37, 37, 0.45);
    background: rgba(245, 37, 37, 0.1);
  }
  .ze-sec.ze-drop-over {
    border-color: rgba(245, 37, 37, 0.55);
    background: rgba(245, 37, 37, 0.08);
  }
  .ze-sec-members {
    margin: 6px 0 0;
    padding: 0;
    list-style: none;
    min-height: 8px;
  }
  .ze-sec-members li {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    margin-bottom: 2px;
    border-radius: var(--radius-xs);
    font-size: 12px;
    color: var(--muted);
    cursor: grab;
    border: 1px solid transparent;
  }
  .ze-sec-members li:hover {
    color: var(--text);
    background: rgba(255,255,255,0.04);
  }
  .ze-sec-members li.ze-dragging { opacity: 0.45; }
  .ze-sec-members .ze-swatch {
    flex: 0 0 auto;
  }
  .ze-sec-members li span {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ze-area {
    margin-bottom: 6px;
    border: 1px solid transparent;
    border-radius: var(--radius-xs);
    padding: 6px;
    min-height: 44px;
  }
  .ze-area.selected {
    border-color: rgba(245, 37, 37, 0.45);
    background: rgba(245, 37, 37, 0.1);
  }
  .ze-area.ze-drop-over {
    border-color: rgba(245, 37, 37, 0.55);
    background: rgba(245, 37, 37, 0.08);
  }
  .ze-area-top {
    display: grid;
    grid-template-columns: 14px 1fr auto;
    gap: 6px;
    align-items: center;
  }
  .ze-area-members {
    margin: 6px 0 0;
    padding: 0;
    list-style: none;
    min-height: 8px;
  }
  .ze-area-members li {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    margin-bottom: 2px;
    border-radius: var(--radius-xs);
    font-size: 12px;
    color: var(--muted);
    cursor: grab;
    border: 1px solid transparent;
  }
  .ze-area-members li:hover {
    color: var(--text);
    background: rgba(255,255,255,0.04);
  }
  .ze-area-members li.ze-dragging { opacity: 0.45; }
  .ze-area-members li span {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ze-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: rgba(12, 14, 18, 0.96);
  }
  #ze-status {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: var(--muted);
  }
  #ze-status[data-kind='ok'] { color: #7bc96f; }
  #ze-status[data-kind='err'] { color: #e2622a; }
  .btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:hover { background: rgba(255,255,255,0.06); }
  .btn.primary {
    border-color: rgba(245, 37, 37, 0.55);
    background: rgba(245, 37, 37, 0.16);
  }
  .btn.primary.is-dirty {
    background: rgba(245, 37, 37, 0.35);
  }
  .ze-modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    padding: 20px;
  }
  .ze-modal[hidden] { display: none; }
  .ze-modal-card {
    width: min(420px, 100%);
    padding: 18px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: #12151a;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
  }
  .ze-modal-card p { margin: 0 0 10px; font-size: 14px; line-height: 1.45; }
  .ze-modal-hint { color: var(--muted); font-size: 12px !important; }
  .ze-modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }
  a.ze-back {
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    white-space: nowrap;
  }
  a.ze-back:hover { color: var(--text); }
</style>
</head>
<body>
  <div class="ze">
    <header class="ze-top">
      <a class="ze-back" href="/tools">← Tools</a>
      <div class="ze-brand">Position <span>Editor</span></div>
      <div class="ze-maps" id="ze-maps"></div>
    </header>
    <div class="ze-body">
      <div class="ze-stage">
        <div class="ze-float">
          <button type="button" id="ze-zoom-out" title="Zoom out">−</button>
          <span id="ze-zoom">100%</span>
          <button type="button" id="ze-zoom-in" title="Zoom in">+</button>
          <button type="button" id="ze-reset" title="Reset view">⟲</button>
        </div>
        <canvas id="ze-canvas"></canvas>
      </div>
      <aside class="ze-side">
        <div class="ze-side-head">
          <div class="ze-color-mode" id="ze-color-mode" role="group" aria-label="Color mode">
            <button type="button" data-mode="zone" class="active" title="One color per position">Positions</button>
            <button type="button" data-mode="section" title="One color per zone">Zones</button>
            <button type="button" data-mode="area" title="One color per area">Areas</button>
            <button type="button" data-mode="none" title="Labels only">None</button>
          </div>
        </div>
        <details class="ze-panel" open>
          <summary>Positions</summary>
          <div class="ze-panel-body">
            <div class="ze-field">
              <input id="ze-name" type="text" maxlength="48" value="" placeholder="Position name" />
            </div>
            <div id="ze-list" class="ze-panel-list ze-list-drop"></div>
          </div>
        </details>
        <details class="ze-panel" open>
          <summary>Zones</summary>
          <div class="ze-panel-body">
            <div class="ze-field ze-field-row">
              <input id="ze-section-name" type="text" maxlength="48" value="" placeholder="Zone name" />
              <button type="button" class="ze-icon-btn" id="ze-section-add" title="Add selected positions to this zone">+</button>
            </div>
            <div id="ze-sections-list" class="ze-panel-list"></div>
          </div>
        </details>
        <details class="ze-panel" open>
          <summary>Areas</summary>
          <div class="ze-panel-body">
            <div class="ze-field ze-field-row">
              <input id="ze-area-name" type="text" maxlength="48" value="" placeholder="Area name" />
              <button type="button" class="ze-icon-btn" id="ze-area-add" title="Add selected zones to this area">+</button>
            </div>
            <div id="ze-areas-list" class="ze-panel-list"></div>
          </div>
        </details>
      </aside>
    </div>
    <footer class="ze-foot">
      <span id="ze-status"></span>
      <button type="button" class="btn" id="ze-discard">Discard</button>
      <button type="button" class="btn primary" id="ze-save">Review &amp; Save</button>
    </footer>
  </div>
  <div class="ze-modal" id="ze-overlap" hidden>
    <div class="ze-modal-card" id="ze-overlap-body"></div>
  </div>
  <script type="module" src="/src/tools/zoneEditorMain.js"></script>
</body>
</html>
